[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gitradar"
version = "0.1.1"
description = "CLI tool for GitHub market & gap analysis using LLM and GitHub REST API"
readme = "README.md"
authors = [
    { name = "GitRadar Developer", email = "developer@example.com" }
]
requires-python = ">=3.10"
dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "litellm>=1.0.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.0.0",
    "flask>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
gitradar = "gitradar.cli:app"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
gitradar = ["prompts/*.j2", "web/templates/*.html", "web/static/**/*"]
